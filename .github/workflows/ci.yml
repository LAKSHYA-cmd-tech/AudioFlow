name: Windows build and regression checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      AUDIOFLOW_SMOKE_OUTPUT: '0'
      AUDIOFLOW_TEST_ROOT: ${{ runner.temp }}/audioflow-tests
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Restore projects
        run: dotnet restore tests/Regression/Regression.csproj --configfile tests/NuGet.Config
      - name: Build Release application and regression runner
        run: dotnet build tests/Regression/Regression.csproj -c Release --no-restore
      - name: Check version synchronization
        run: ./installer/Sync-Version.ps1 -Check
      - name: Run offline regression checks
        run: dotnet tests/Regression/bin/Release/net8.0-windows/Regression.dll

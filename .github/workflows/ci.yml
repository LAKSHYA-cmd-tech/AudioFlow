name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore application
        run: dotnet restore AudioFlow.csproj -p:Platform=x64
      - name: Build Release application
        run: dotnet build AudioFlow.csproj -c Release --no-restore -p:Platform=x64

      - name: Run playback-buffer regression checks
        run: dotnet run --project driver/tests/PlaybackBufferTests/PlaybackBufferTests.csproj -c Release
